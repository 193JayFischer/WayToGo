<!doctype html><html><head><meta charset="utf-8"><style>
:root { --y:#ffd500; --b:#1c9be8; --bd:#0f6fb4; --k:#111; --ink:#1b1f27; --mut:#4a5160; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Inter',sans-serif; background:#ddd; color:var(--k); -webkit-font-smoothing:antialiased; }
.ad { position:relative; overflow:hidden; background:#fbf8ee; }
.in { position:relative; height:100%; display:flex; flex-direction:column; }
.sun { position:absolute; border-radius:50%; background:var(--y); }
.arc { position:absolute; border-radius:50%; border:solid var(--b); }
.top { display:flex; justify-content:space-between; align-items:center; }
.tag { background:var(--k); color:#fff; font-weight:800; letter-spacing:.14em; text-transform:uppercase; border-radius:999px; }
h1 { font-weight:900; letter-spacing:-.045em; line-height:.98; }
h1 mark { background:linear-gradient(transparent 52%, var(--y) 52%, var(--y) 92%, transparent 92%); color:inherit; padding:0 .08em; margin:0 -.08em; }
.sub { font-weight:700; color:var(--mut); }
.for { display:flex; flex-wrap:wrap; align-items:center; }
.for span.l { font-weight:800; color:var(--bd); text-transform:uppercase; letter-spacing:.12em; }
.chip { font-weight:800; background:#fff; border:solid var(--k); border-radius:999px; box-shadow:5px 5px 0 var(--k); }
.facts { display:grid; }
.fact { display:flex; align-items:center; font-weight:800; }
.fact i { flex:none; display:grid; place-items:center; background:var(--b); color:#fff; border-radius:50%; font-style:normal; font-weight:900; }
.cta { margin-top:auto; background:var(--k); color:#fff; text-align:center; }
.cta b { display:block; color:var(--y); font-weight:800; }
.cta .url { font-weight:900; letter-spacing:-.03em; line-height:1.05; } .cta .url span { color:var(--b); }
.cta .ph { color:#d7dbe3; font-weight:500; }

/* square 1080 */
.square { width:1080px; height:1080px; } .square .in { padding:56px 60px 56px; }
.square .sun { width:520px; height:520px; right:-170px; top:-190px; } .square .arc { width:300px; height:300px; right:-120px; top:250px; border-width:26px; opacity:.9; }
.square .logo { height:150px; } .square .tag { font-size:19px; padding:12px 24px; }
.square h1 { font-size:124px; margin-top:34px; } .square .sub { font-size:33px; margin-top:20px; }
.square .for { gap:16px; margin-top:34px; } .square .for span.l { font-size:22px; width:100%; margin-bottom:-2px; } .square .chip { font-size:30px; padding:10px 24px; border-width:4px; }
.square .facts { grid-template-columns:1fr 1fr; gap:18px 26px; margin-top:38px; margin-bottom:30px; } .square .fact { font-size:31px; gap:14px; } .square .fact i { width:44px; height:44px; font-size:26px; }
.square .cta { border-radius:30px; padding:22px 30px 24px; } .square .cta b { font-size:30px; } .square .cta .url { font-size:62px; } .square .cta .ph { font-size:27px; }

/* wide 1200x628 */
.wide { width:1200px; height:628px; } .wide .in { padding:30px 44px 30px; }
.wide .sun { width:360px; height:360px; right:-110px; top:-150px; } .wide .arc { display:none; }
.wide .logo { height:92px; } .wide .tag { font-size:16px; padding:10px 20px; margin-right:210px; }
.wide .body { display:grid; grid-template-columns:1.12fr 1fr; gap:34px; align-items:center; flex:1; }
.wide h1 { font-size:86px; } .wide .sub { font-size:23px; margin-top:12px; }
.wide .for { gap:10px; } .wide .for span.l { font-size:16px; width:100%; } .wide .chip { font-size:21px; padding:6px 16px; border-width:3px; box-shadow:4px 4px 0 var(--k); }
.wide .facts { grid-template-columns:1fr; gap:9px; margin-top:18px; } .wide .fact { font-size:24px; gap:12px; } .wide .fact i { width:34px; height:34px; font-size:20px; }
.wide .cta { border-radius:22px; padding:12px 28px; display:flex; justify-content:space-between; align-items:center; text-align:left; } .wide .cta b { font-size:22px; } .wide .cta .url { font-size:40px; } .wide .cta .ph { font-size:21px; }

/* story 1080x1920 */
.story { width:1080px; height:1920px; } .story .in { padding:150px 70px 190px; }
.story .sun { width:640px; height:640px; right:-220px; top:-200px; } .story .arc { width:360px; height:360px; left:-150px; bottom:420px; border-width:30px; opacity:.9; }
.story .logo { height:190px; } .story .tag { font-size:22px; padding:14px 28px; }
.story h1 { font-size:150px; margin-top:90px; } .story .sub { font-size:42px; margin-top:30px; line-height:1.25; }
.story .for { gap:20px; margin-top:70px; } .story .for span.l { font-size:26px; width:100%; } .story .chip { font-size:40px; padding:14px 30px; border-width:5px; box-shadow:6px 6px 0 var(--k); }
.story .facts { grid-template-columns:1fr; gap:26px; margin-top:80px; } .story .fact { font-size:46px; gap:20px; } .story .fact i { width:64px; height:64px; font-size:38px; }
.story .cta { border-radius:40px; padding:40px 30px 44px; } .story .cta b { font-size:38px; } .story .cta .url { font-size:84px; } .story .cta .ph { font-size:34px; }
</style></head><body><!--BODY--></body></html>
