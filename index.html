<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Way To Go NJ</title>
  <meta name="description" content="Way To Go NJ is hiring CDL school bus drivers in Toms River, NJ. $22 to $28 per hour, flexible schedules, training available.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffc72c'/%3E%3Cpath d='M18 22h28v22H18z' fill='%230b1a33'/%3E%3Ccircle cx='24' cy='46' r='4' fill='%23ffc72c'/%3E%3Ccircle cx='40' cy='46' r='4' fill='%23ffc72c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(1200px 700px at 15% 10%, #1b3a73 0%, transparent 60%),
                  radial-gradient(900px 600px at 90% 90%, #3a2f00 0%, transparent 55%),
                  var(--navy);
      color: #fff;
    }
    .sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .sky i {
      position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .sky i:nth-child(1) { width: 520px; height: 520px; background: #ffc72c; left: -160px; bottom: -200px; }
    .sky i:nth-child(2) { width: 420px; height: 420px; background: #0b5fff; right: -120px; top: -140px; animation-delay: -7s; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,-30px) scale(1.08); } }

    .road {
      position: fixed; left: 0; right: 0; bottom: 0; height: 110px; pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.35));
    }
    .road::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 48px; height: 4px;
      background: repeating-linear-gradient(90deg, var(--yellow) 0 60px, transparent 60px 120px);
      opacity: .7; animation: lane 1.6s linear infinite;
    }
    @keyframes lane { from { background-position: 0 0; } to { background-position: 120px 0; } }

    .stage {
      position: relative; z-index: 1; min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 24px 20px 120px;
    }
    .brand { font-weight: 900; letter-spacing: .14em; text-transform: uppercase; font-size: .85rem; color: var(--yellow); margin-bottom: 22px; }
    .stage h1 { font-size: clamp(2.6rem, 8vw, 5.4rem); font-weight: 900; line-height: 1; letter-spacing: -.03em; margin: 0 0 18px; max-width: 14ch; }
    .stage h1 em { font-style: normal; color: var(--yellow); }
    .stage p { font-size: clamp(1rem, 2.2vw, 1.3rem); color: #c9d4ea; max-width: 560px; margin: 0 0 34px; }
    .chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 36px; }
    .chip { font-size: .9rem; font-weight: 600; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
    .btn.hero { padding: 22px 56px; font-size: 1.35rem; font-weight: 800; box-shadow: 0 14px 40px rgba(255,199,44,.4); }
    .admin {
      position: fixed; right: 14px; bottom: 12px; z-index: 2; font-size: .75rem; color: rgba(255,255,255,.4);
      padding: 6px 10px; border-radius: 6px;
    }
    .admin:hover { color: #fff; background: rgba(255,255,255,.1); }
    @media (max-height: 640px) { .chips { display: none; } .stage p { margin-bottom: 22px; } }
  </style>
</head>
<body>
  <div class="sky"><i></i><i></i></div>
  <div class="road"></div>

  <main class="stage">
    <div class="brand">Way To Go NJ</div>
    <h1>Drive the bus.<br><em>Shape the future.</em></h1>
    <p>Now hiring CDL school bus drivers in Toms River, New Jersey. Flexible schedules, guaranteed hours, and training available.</p>
    <div class="chips">
      <span class="chip">$22 to $28 per hour</span>
      <span class="chip">AM, PM and split shifts</span>
      <span class="chip">Sign-on bonus opportunities</span>
    </div>
    <a class="btn hero" href="drive.html">Drive with us</a>
  </main>

  <a class="admin" href="admin.html">Admin</a>
</body>
</html>
